name: Load Test Server

on:
  workflow_dispatch:          # manual trigger only — you click "Run workflow"
    inputs:
      pool_size:
        description: 'Browser pool size (concurrent users)'
        required: true
        default: '2'
        type: choice
        options: ['1', '2', '3', '4']
      session_duration:
        description: 'How long to keep server alive (minutes)'
        required: true
        default: '60'

jobs:
  run-server:
    runs-on: ubuntu-latest    # free Ubuntu VM, 2 vCPU, 7GB RAM
    timeout-minutes: 120      # max 2 hours regardless

    steps:
      # ── Step 1: Get your code ──────────────────────────────────────────
      - name: Checkout code
        uses: actions/checkout@v4

      # ── Step 2: Install Node.js ────────────────────────────────────────
      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: poc-backend/package-lock.json

      # ── Step 3: Install Redis ──────────────────────────────────────────
      - name: Install and start Redis
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y redis-server
          sudo systemctl start redis-server
          redis-cli ping   # confirms Redis is up

      # ── Step 4: Install backend dependencies ──────────────────────────
      - name: Install dependencies
        working-directory: poc-backend
        run: npm ci

      # ── Step 5: Install Playwright + Chrome ───────────────────────────
      - name: Install Playwright Chrome
        working-directory: poc-backend
        run: npx playwright install chromium --with-deps

      # ── Step 6: Create .env from GitHub Secrets ───────────────────────
      - name: Create .env file
        working-directory: poc-backend
        run: |
          cat > .env << EOF
          PORT=3001
          NODE_ENV=production
          FLOW_MODE=${{ secrets.FLOW_MODE }}
          HEADLESS=true
          FLOW_SESSION_COOKIE=${{ secrets.FLOW_SESSION_COOKIE }}
          JWT_SECRET=${{ secrets.JWT_SECRET }}
          REDIS_URL=${{ secrets.REDIS_URL }}
          BROWSER_POOL_SIZE=${{ github.event.inputs.pool_size }}
          CREDIT_WARN_THRESHOLD=500
          CREDIT_CRITICAL_THRESHOLD=50
          EOF
          echo ".env created"

      # ── Step 7: Create media directory ────────────────────────────────
      - name: Setup directories
        working-directory: poc-backend
        run: mkdir -p public/media logs

      # ── Step 8: Start the backend server ──────────────────────────────
      - name: Start backend server
        working-directory: poc-backend
        run: |
          # Start in background, log to file
          nohup node server.js > logs/server.log 2>&1 &
          echo $! > server.pid
          echo "Server PID: $(cat server.pid)"

          # Wait for server to be ready (up to 120 seconds)
          echo "Waiting for server to start..."
          for i in $(seq 1 40); do
            if curl -sf http://localhost:3001/health > /dev/null 2>&1; then
              echo "✅ Server is up after ${i}x3 seconds"
              curl http://localhost:3001/health
              break
            fi
            echo "  Attempt $i/40 — waiting 3s..."
            sleep 3
          done

      # ── Step 9: Install and start ngrok tunnel ─────────────────────────
      - name: Start ngrok tunnel
        run: |
          # Install ngrok
          curl -sSL https://ngrok-agent.s3.amazonaws.com/ngrok.asc | \
            sudo tee /etc/apt/trusted.gpg.d/ngrok.asc >/dev/null
          echo "deb https://ngrok-agent.s3.amazonaws.com buster main" | \
            sudo tee /etc/apt/sources.list.d/ngrok.list
          sudo apt-get update -qq && sudo apt-get install ngrok -qq

          # Authenticate
          ngrok config add-authtoken ${{ secrets.NGROK_AUTHTOKEN }}

          # Start tunnel in background
          nohup ngrok http 3001 --log=stdout > logs/ngrok.log 2>&1 &
          sleep 5

          # Get the public URL
          PUBLIC_URL=$(curl -s http://localhost:4040/api/tunnels | \
            python3 -c "import sys,json; d=json.load(sys.stdin); \
            print(d['tunnels'][0]['public_url'])")

          echo "======================================"
          echo "🌐 PUBLIC URL: $PUBLIC_URL"
          echo "======================================"
          echo ""
          echo "Share this with your testers:"
          echo "  API Base URL: ${PUBLIC_URL}/api"
          echo ""
          echo "Health check: ${PUBLIC_URL}/health"
          echo "======================================"

          # Save URL to file for reference
          echo "$PUBLIC_URL" > /tmp/public_url.txt
          echo "PUBLIC_URL=${PUBLIC_URL}" >> $GITHUB_ENV

      # ── Step 10: Print test instructions ──────────────────────────────
      - name: Print test instructions
        run: |
          echo ""
          echo "╔══════════════════════════════════════════════╗"
          echo "║        SERVER IS LIVE — SHARE THIS URL       ║"
          echo "╠══════════════════════════════════════════════╣"
          echo "║  URL: ${{ env.PUBLIC_URL }}"
          echo "║  Pool size: ${{ github.event.inputs.pool_size }} concurrent users"
          echo "╚══════════════════════════════════════════════╝"
          echo ""
          echo "Each tester should set in their Electron .env:"
          echo "  VITE_API_URL=${{ env.PUBLIC_URL }}/api"
          echo ""
          echo "Server will stay alive for ${{ github.event.inputs.session_duration }} minutes"
          echo "Then cancel this workflow to shut down"

      # ── Step 11: Keep server alive ─────────────────────────────────────
      - name: Keep server alive during testing
        run: |
          DURATION=${{ github.event.inputs.session_duration }}
          echo "Server will run for ${DURATION} minutes..."
          echo "Cancel this workflow manually when testing is done"
          echo ""

          # Print health every 5 minutes so you can monitor in the logs
          for i in $(seq 1 $((DURATION / 5))); do
            sleep 300
            echo ""
            echo "=== Health check at $(date) ==="
            curl -s http://localhost:3001/health | python3 -m json.tool || true
            echo "=== Tail of server log ==="
            tail -20 poc-backend/logs/server.log || true
          done

      # ── Step 12: Print final log on completion ─────────────────────────
      - name: Print server logs
        if: always()
        run: |
          echo "=== Final server log ==="
          tail -100 poc-backend/logs/server.log || true
