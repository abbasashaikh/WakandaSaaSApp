name: Load Test Server

on:
  workflow_dispatch:
    inputs:
      pool_size:
        description: 'Browser pool size (concurrent users)'
        required: true
        default: '2'
        type: choice
        options:
          - '1'
          - '2'
          - '3'
          - '4'
      session_duration:
        description: 'How long to keep server alive (minutes)'
        required: true
        default: '60'

jobs:
  run-server:
    runs-on: ubuntu-latest
    timeout-minutes: 120

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: poc-backend/package-lock.json

      - name: Install and start Redis
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y redis-server
          sudo systemctl start redis-server
          redis-cli ping

      - name: Install dependencies
        working-directory: poc-backend
        run: npm ci

      - name: Install Playwright Chrome
        working-directory: poc-backend
        run: npx playwright install chromium --with-deps

      - name: Create .env file
        working-directory: poc-backend
        run: |
          echo "PORT=3001" > .env
          echo "NODE_ENV=production" >> .env
          echo "FLOW_MODE=${{ secrets.FLOW_MODE }}" >> .env
          echo "HEADLESS=true" >> .env
          echo "FLOW_SESSION_COOKIE=${{ secrets.FLOW_SESSION_COOKIE }}" >> .env
          echo "JWT_SECRET=${{ secrets.JWT_SECRET }}" >> .env
          echo "REDIS_URL=redis://127.0.0.1:6379" >> .env
          echo "BROWSER_POOL_SIZE=${{ github.event.inputs.pool_size }}" >> .env
          echo "CREDIT_WARN_THRESHOLD=500" >> .env
          echo "CREDIT_CRITICAL_THRESHOLD=50" >> .env
          echo ".env created successfully"

      - name: Setup directories
        working-directory: poc-backend
        run: mkdir -p public/media logs

      - name: Start backend server
        working-directory: poc-backend
        run: |
          nohup node server.js > logs/server.log 2>&1 &
          echo $! > server.pid
          echo "Server PID: $(cat server.pid)"
          echo "Waiting for server to start..."
          for i in $(seq 1 40); do
            if curl -sf http://localhost:3001/health > /dev/null 2>&1; then
              echo "Server is up after $((i*3)) seconds"
              curl http://localhost:3001/health
              break
            fi
            echo "  Attempt $i/40 — waiting 3s..."
            sleep 3
          done

      - name: Install ngrok
        run: |
          curl -sSL https://ngrok-agent.s3.amazonaws.com/ngrok.asc \
            | sudo tee /etc/apt/trusted.gpg.d/ngrok.asc > /dev/null
          echo "deb https://ngrok-agent.s3.amazonaws.com buster main" \
            | sudo tee /etc/apt/sources.list.d/ngrok.list
          sudo apt-get update -qq
          sudo apt-get install ngrok -qq

      - name: Start ngrok tunnel
        run: |
          ngrok config add-authtoken ${{ secrets.NGROK_AUTHTOKEN }}
          nohup ngrok http 3001 > /tmp/ngrok.log 2>&1 &
          sleep 8
          PUBLIC_URL=$(curl -s http://localhost:4040/api/tunnels \
            | python3 -c "import sys,json; print(json.load(sys.stdin)['tunnels'][0]['public_url'])")
          echo "PUBLIC_URL=${PUBLIC_URL}" >> $GITHUB_ENV
          echo "======================================"
          echo "PUBLIC URL: ${PUBLIC_URL}"
          echo "======================================"
          echo "Health check: ${PUBLIC_URL}/health"
          echo "======================================"

      - name: Print test instructions
        run: |
          echo "=================================="
          echo "SERVER IS LIVE"
          echo "Public URL : ${{ env.PUBLIC_URL }}"
          echo "API URL    : ${{ env.PUBLIC_URL }}/api"
          echo "=================================="
          echo "Tester Electron .env setting:"
          echo "VITE_API_URL=${{ env.PUBLIC_URL }}"
          echo "=================================="

      - name: Keep server alive during testing
        run: |
          DURATION=${{ github.event.inputs.session_duration }}
          echo "Server will run for ${DURATION} minutes"
          echo "Cancel this workflow manually when done"
          for i in $(seq 1 $((DURATION / 5))); do
            sleep 300
            echo "=== Health check $(date) ==="
            curl -s http://localhost:3001/health | python3 -m json.tool || true
            echo "=== Recent server log ==="
            tail -10 poc-backend/logs/server.log || true
          done

      - name: Print server logs
        if: always()
        run: tail -100 poc-backend/logs/server.log || true
